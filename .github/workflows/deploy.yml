name: Deploy WhimReward to OCI
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: whimreward-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Security audit
        run: pnpm audit --audit-level high
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer application
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            ./ "ubuntu@${OCI_HOST}:/opt/whimreward/"
      - name: Install production dependencies and restart service
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "ubuntu@${OCI_HOST}" \
            'cd /opt/whimreward &&
             corepack pnpm@10.32.1 install --prod --frozen-lockfile &&
             sudo /usr/bin/systemctl restart whimreward.service &&
             sudo /usr/bin/systemctl is-active whimreward.service &&
             curl --fail --silent --show-error http://127.0.0.1:3000/health'
